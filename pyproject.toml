[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Nexora"
version = "0.1.0"
description = "Autonomous analytical investigation platform"
requires-python = ">=3.10"

dependencies = [
    "faker",
    "numpy",
    "polars",
    "pyarrow",
    "duckdb",
    "psycopg[binary]",
    "python-dotenv"
]

[tool.setuptools.packages.find]
where = ["src"]